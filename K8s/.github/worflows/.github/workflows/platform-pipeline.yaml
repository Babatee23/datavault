name: Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: k3s-platform-repo

jobs:

##################################################################

# SECURITY VALIDATION

##################################################################

  security:

  
   runs-on: ubuntu-latest

   steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Trufflehog Secret Scan
      uses: trufflesecurity/trufflehog@main

    - name: Gitleaks
      uses: gitleaks/gitleaks-action@v2

    - name: Semgrep
      uses: returntocorp/semgrep-action@v1

    - name: Python SAST
      run: |
       pip install bandit
       bandit -r datavault-api/

    - name: Dependency Scan
      run: |
        pip install pip-audit
        pip-audit -r datavault-api/requirements.txt


##################################################################

# TERRAFORM VALIDATION

##################################################################
  terraform:


    runs-on: ubuntu-latest
    needs: security

    defaults:
      run:
        working-directory: terraform

    steps:

    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3

    - run: terraform fmt -check

    - run: terraform init

    - run: terraform validate

    - name: tfsec
      uses: aquasecurity/tfsec-action@v1

    - name: Checkov
      uses: bridgecrewio/checkov-action@master

    - run: terraform plan


##################################################################

# BUILD IMAGE

##################################################################
  build:

    runs-on: ubuntu-latest
    needs: terraform

    steps:

    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
       docker build \
       -t $ECR_REPOSITORY:${{ github.sha }} \
       ./datavault-api


##################################################################

# CONTAINER SECURITY

##################################################################

  image-scan:


   runs-on: ubuntu-latest
   needs: build

   steps:

   - uses: actions/checkout@v4

   - name: Trivy Scan
     uses: aquasecurity/trivy-action@master
     with:
      image-ref: k3s-platform-repo:${{ github.sha }}
      severity: HIGH,CRITICAL
      exit-code: 1


##################################################################

# KUBERNETES SECURITY

##################################################################

  kubernetes-security:


    runs-on: ubuntu-latest
    needs: image-scan

    steps:

    - uses: actions/checkout@v4

    - name: Kube-Linter
      uses: stackrox/kube-linter-action@v1


##################################################################

# AWS AUTHENTICATION

##################################################################

  ecr-push:

    runs-on: ubuntu-latest
    needs: kubernetes-security

    steps:

    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
       role-to-assume: ${{ secrets.AWS_ROLE }}
       aws-region: us-east-1

    - name: Login ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Image
      run: |
       docker build \
       -t $ECR_REPOSITORY:${{ github.sha }} \
       ./datavault-api

    - name: Tag Image
      run: |
       docker tag \
       $ECR_REPOSITORY:${{ github.sha }} \
       ${{ secrets.ECR_URI }}/$ECR_REPOSITORY:${{ github.sha }}

    - name: Push Image
      run: |
       docker push \
       ${{ secrets.ECR_URI }}/$ECR_REPOSITORY:${{ github.sha }}





##################################################################

# UPDATE GITOPS MANIFEST

##################################################################

   update-manifest:

   runs-on: ubuntu-latest
   needs: ecr-push

   steps:

   - uses: actions/checkout@v4

   - name: Update Deployment Image
     run: |
      sed -i \
      "s|image:.*|image: ${{ secrets.ECR_URI }}/k3s-platform-repo:${{ github.sha }}|" \
      K8s/deployment.yaml

   - name: Commit Manifest
     run: |
      git config user.name github-actions
      git config user.email github-actions@github.com

      git add .

      git commit -m "Update image version"

      git push


##################################################################

# POST DEPLOYMENT SECURITY

##################################################################

  dast:


   runs-on: ubuntu-latest
   needs: update-manifest

   steps:

   - name: OWASP ZAP
     uses: zaproxy/action-full-scan@v0.10.0
     with:
      target: "https://staging.your-domain.com"


##################################################################

# COMPLETE

##################################################################

  deployment-complete :


   runs-on: ubuntu-latest
   needs: dast

   steps:

   - run: echo "ArgoCD deployment complete"

